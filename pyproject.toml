[project]
name = "galad"
version = "1.0.0"
description = "GaLAD: regularized Gaussian mixtures for training-free few-shot industrial anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "transformers>=4.57",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["galad"]
